<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>SpiritTV — Register</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: #fff;
        font-family: Montserrat, Arial, sans-serif;
      }

      main {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 16px 60px;
      }
      form {
        width: 100%;
        width: 440px;
        padding: 33px;
        box-sizing: border-box;
        background: #0d0d0d;
        border: 1px solid #262626;
        border-radius: 20px;
        animation: fade 0.5s both;
      }
      h1 {
        margin: 0 0 6px;
        font-family: Oswald, sans-serif;
        font-size: 38px;
        text-transform: uppercase;
      }
      .inputs {
        display: flex;
        flex-direction: column;
        gap: 30px;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .nav-link {
        color: #fff;
        font-family: Oswald, sans-serif;
        font-size: 18px;
        text-transform: uppercase;
        text-decoration: none;
        transition: color 0.2s;
      }
      .nav-link:hover,
      .nav-link.active {
        color: #ff1a00;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px 20px;
        background: #111;
        border: 1px solid #262626;
        border-radius: 40px;
        color: #fff;
        font-family: Montserrat, Arial, sans-serif;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s;
      }

      .submit-btn {
        padding: 15px;
        background: #ff1a00;
        border: none;
        border-radius: 40px;
        color: #fff;
        font-family: Montserrat, Arial, sans-serif;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .submit-btn:hover {
        background: #e01700;
        transform: translateY(-2px);
      }
      .pass-wrap {
        position: relative;
      }
    </style>
  </head>

  <body>
    <main>
      <form id="form" class="reg-card">
        <h1>Register</h1>
        <p style="margin: 0 0 24px; color: #8c8c8c; font-size: 14px">
          Create an account to save your favourite movies.
        </p>

        <div class="inputs">
          <input id="name" class="nameInput" placeholder="Full name" required />

          <input id="email" class="emailInput" placeholder="Email" required />

          <input
            id="password"
            type="password"
            class="password1"
            placeholder="Password (8+ characters)"
            style="padding-right: 70px"
          />

          <input
            id="confirm"
            type="password"
            class="password"
            placeholder="Confirm password"
          />
        </div>

        <p
          id="message"
          style="margin: 0 0 14px; min-height: 20px; text-align: center"
        ></p>
        <button type="submit" class="submit-btn" style="width: 100%">
          Create account
        </button>

        <p
          style="
            margin: 20px 0 0;
            text-align: center;
            font-size: 14px;
            color: #8c8c8c;
          "
        >
          Back to
          <a href="index.html" style="color: #ff9500; text-decoration: none"
            >movies</a
          >
        </p>
      </form>
    </main>
    <script src="register.js"></script>
  </body>
</html>
