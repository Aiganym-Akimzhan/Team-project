<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      nav {
        font-family: Oswald, sans-serif;
      }
      nav button,
      nav a {
        color: #fff;
      }

      nav button:hover,
      nav a:hover {
        color: #ff1a00;
        transition: 0.3s;
      }
    </style>
    <header
      style="
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
        padding: 20px 25px;
        background: #050505;
      "
    >
      <a
        href="/index.html"
        style="
          display: block;
          position: relative;
          width: 170px;
          height: 44px;
          overflow: hidden;
        "
      >
        <img
          src="/logo.png"
          alt="SpiritTV"
          style="
            position: absolute;
            left: -61px;
            top: -72px;
            width: 288px;
            max-width: none;
          "
        />
      </a>
      <nav
        style="
          display: flex;
          flex-wrap: wrap;
          gap: 4px;
          padding: 6px 10px;
          background: #111;
          border: 1px solid #262626;
          border-radius: 40px;
        "
      >
        <a
          href="/index.html"
          style="
            padding: 10px 18px;
            font-family: Oswald, sans-serif;

            font-size: 18px;
            text-decoration: none;
          "
        >
          HOME
        </a>
        <a
          href="/about/index.html"
          style="
            padding: 10px 18px;
            font-family: Oswald, sans-serif;

            font-size: 18px;
            text-decoration: none;
          "
        >
          ABOUT US
        </a>
        <a
          href="/subscription/index.html"
          style="
            padding: 10px 18px;
            font-family: Oswald, sans-serif;
            font-size: 18px;
            text-decoration: none;
          "
          >SUBSCRIPTION</a
        >

        <a
          href="/register/index.html"
          style="
            padding: 10px 18px;
            font-family: Oswald, sans-serif;

            font-size: 18px;
            text-decoration: none;
          "
        >
          REGISTER
        </a>
        <a
          id="usersNavLink"
          href="/users/index.html"
          style="
            display: none;
            padding: 10px 18px;
            font-family: Oswald, sans-serif;
            font-size: 18px;
            text-decoration: none;
          "
          >USERS</a
        >
        <button
          id="loginBtn"
          style="
            padding: 10px 18px;
            background: none;
            font-family: Oswald, sans-serif;
            border: none;
            color: white;
            font-size: 18px;
            text-decoration: none;
          "
        >
          LOGIN
        </button>
      </nav>
    </header>
  </body>
</html>
