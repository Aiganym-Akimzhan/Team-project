<div
  id="loginBox"
  style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 40;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #000d;
  "
>
  <form
    id="loginForm"
    style="
      position: relative;
      width: min(380px, 100%);
      display: grid;
      gap: 14px;
      padding: 32px;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 20px;
      color: #fff;
    "
  >
    <button
      id="loginClose"
      type="button"
      style="
        position: absolute;
        top: 12px;
        right: 14px;
        background: none;
        border: 0;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
      "
    >
      ×
    </button>
    <h2 style="margin: 0; font-family: Oswald, sans-serif">LOGIN</h2>
    <input
      id="loginName"
      placeholder="Username or email"
      required
      style="
        padding: 13px 16px;
        border: 1px solid #333;
        border-radius: 24px;
        background: #111;
        color: #fff;
      "
    />
    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
      required
      style="
        padding: 13px 16px;
        border: 1px solid #333;
        border-radius: 24px;
        background: #111;
        color: #fff;
      "
    />
    <p id="loginMessage" style="min-height: 20px; margin: 0"></p>
    <button
      type="submit"
      style="
        padding: 13px;
        border: 0;
        border-radius: 24px;
        background: #fa003f;
        color: #fff;
        cursor: pointer;
      "
    >
      Login
    </button>
  </form>
</div>
<div
  id="profileBox"
  style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 41;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #000d;
  "
>
  <form
    id="profileForm"
    style="
      position: relative;
      width: min(420px, 100%);
      display: grid;
      gap: 14px;
      padding: 30px;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 18px;
      color: #fff;
    "
  >
    <button
      id="profileClose"
      type="button"
      style="
        position: absolute;
        top: 10px;
        right: 12px;
        background: none;
        border: 0;
        color: white;
        font-size: 24px;
        cursor: pointer;
      "
    >
      ×
    </button>
    <h2 style="margin: 0; font-family: Oswald, sans-serif">YOUR ACCOUNT</h2>
    <p id="profileEmail" style="margin: 0; color: #aaa"></p>
    <label for="profileUsername">Username</label>
    <input
      id="profileUsername"
      required
      style="
        padding: 12px;
        border: 1px solid #333;
        border-radius: 20px;
        background: #111;
        color: #fff;
      "
    />
    <p id="profileMessage" style="margin: 0; min-height: 20px"></p>
    <button
      type="submit"
      style="
        padding: 12px;
        background: #fa003f;
        border: 0;
        border-radius: 30px;
        color: white;
        cursor: pointer;
      "
    >
      Save username
    </button>
    <button
      id="logoutBtn"
      type="button"
      style="
        padding: 12px;
        background: #222;
        border: 1px solid #444;
        border-radius: 30px;
        color: white;
        cursor: pointer;
      "
    >
      Log out
    </button>
  </form>
</div>
