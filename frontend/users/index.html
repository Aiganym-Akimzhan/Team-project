<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpiritTV — Users</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: #fff;
        font-family: Montserrat, Arial, sans-serif;
      }
      main {
        width: min(1100px, 100%);
        min-height: 70vh;
        margin: auto;
        padding: 48px 24px;
      }
      h1 {
        font:
          700 42px Oswald,
          sans-serif;
        text-transform: uppercase;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #0d0d0d;
      }
      th,
      td {
        padding: 14px;
        border-bottom: 1px solid #292929;
        text-align: left;
      }
      th {
        color: #ff5278;
      }
      button {
        padding: 9px 14px;
        border: 0;
        border-radius: 20px;
        background: #fa003f;
        color: #fff;
        cursor: pointer;
      }
      #status {
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <section
      style="position: sticky; top: 0; z-index: 5"
      name="navbar"
    ></section>
    <main>
      <h1>Users</h1>
      <p id="status" role="status">Loading users…</p>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Joined</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
    </main>
    <section name="footer"></section>

    <script src="/navbar/navbar.js"></script>
    <script src="/shared.js"></script>
    <script src="/users/index.js"></script>
    <script src="/login.js"></script>
  </body>
</html>
